name: Build

on:
  push:
    branches:
      - main
      - master
      - plus
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles appimage,deb,rpm
          - platform: macos-latest
            args: --bundles dmg
          - platform: windows-latest
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Build Lite app
        run: npm run tauri:build:lite -- ${{ matrix.args }}

      - name: Build Plus app
        run: npm run tauri:build:plus -- ${{ matrix.args }}

      - name: Prepare portable Windows exe
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $versions = Get-Content editionVersions.json | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path release-portable | Out-Null
          Copy-Item `
            -LiteralPath src-tauri/target/release/md-view-lite.exe `
            -Destination "release-portable/md-view-lite_$($versions.lite)_windows-x64-portable.exe"
          Copy-Item `
            -LiteralPath src-tauri/target/release/md-view-plus.exe `
            -Destination "release-portable/md-view-plus_$($versions.plus)_windows-x64-portable.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: md-view-${{ matrix.platform }}
          path: |
            release-portable/*.exe
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
